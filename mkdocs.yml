site_name: Healthcare AI — Preview
site_description: A preview of the first chapters of a book on healthcare AI — regulation, clinical practice, governance, and equity.
site_url: https://zkumar.github.io/healthcare-ai-book-preview/
repo_url: https://github.com/zkumar/healthcare-ai-book-preview
repo_name: zkumar/healthcare-ai-book-preview

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zkumar/healthcare-ai-book-preview
  generator: false

copyright: >
  Preview edition — a living document. Feedback welcome via
  <a href="https://github.com/zkumar/healthcare-ai-book-preview/issues">GitHub Issues</a>.

# NAV-START
nav:
  - Home: index.md
  - Chapter 1 — The Regulated Machine:
    - Read: 01-the-regulated-machine/index.md
    - Practitioner Depth: 01-the-regulated-machine/practitioner.md
  - Chapter 2 — Anatomy of a Healthcare Enterprise:
    - Read: 02-anatomy-of-the-healthcare-enterprise/index.md
    - Practitioner Depth: 02-anatomy-of-the-healthcare-enterprise/practitioner.md
  - Chapter 3 — The Data Reality:
    - Read: 03-the-data-reality/index.md
    - Practitioner Depth: 03-the-data-reality/practitioner.md
# NAV-END
